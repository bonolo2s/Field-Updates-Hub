{% extends 'base.html' %}

{% block title %}Edit Post{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

  <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Field Update</h1>

  {% if messages %}
    {% for message in messages %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-green-50 border border-green-200 text-green-800 text-sm">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
    <form method="POST">
      {% csrf_token %}
      <div class="mb-4">
        <input type="text" name="title" value="{{ form.title.value }}" placeholder="Title" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-4">
        <textarea name="message" placeholder="Share your field update..." rows="5" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500 resize-none">{{ form.message.value }}</textarea>
      </div>
      <div class="mb-6">
        <select name="category"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="pest_alert" {% if form.category.value == 'pest_alert' %}selected{% endif %}>Pest Alert</option>
          <option value="weather" {% if form.category.value == 'weather' %}selected{% endif %}>Weather Observation</option>
          <option value="crop_condition" {% if form.category.value == 'crop_condition' %}selected{% endif %}>Crop Condition</option>
          <option value="fertilizer" {% if form.category.value == 'fertilizer' %}selected{% endif %}>Fertilizer Tip</option>
          <option value="general" {% if form.category.value == 'general' %}selected{% endif %}>General Insight</option>
        </select>
      </div>
      <div class="flex items-center gap-3">
        <button type="submit"
          class="bg-green-600 hover:bg-green-500 text-white font-semibold px-6 py-2 rounded-lg text-sm transition">
          Save Changes
        </button>
        <a href="{% url 'feed' %}" class="text-sm text-gray-400 hover:text-gray-600">Cancel</a>
      </div>
    </form>
  </div>

</div>

{% endblock %}
