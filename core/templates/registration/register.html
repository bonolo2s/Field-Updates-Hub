<!DOCTYPE html>
<html>
<head><title>Register</title></head>
<body>

  <h1>Create Account</h1>

  {% if messages %}
    {% for message in messages %}
      <p>{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
  </form>

  <a href="{% url 'login' %}">Already have an account? Login</a>

</body>
</html>
