{% extends 'base_auth.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">

    <h1 class="text-2xl font-bold text-gray-800 mb-6">Create Account</h1>

    {% if messages %}
      {% for message in messages %}
        <p class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">{{ message }}</p>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <input type="text" name="username" placeholder="Username" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-3">
        <input type="text" name="first_name" placeholder="First name" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-3">
        <input type="text" name="last_name" placeholder="Last name" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-3">
        <input type="email" name="email" placeholder="Email" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-3">
        <input type="password" name="password1" placeholder="Password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <div class="mb-4">
        <input type="password" name="password2" placeholder="Confirm password" required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-500"/>
      </div>
      <button type="submit"
        class="w-full bg-green-700 hover:bg-green-600 text-white font-semibold py-2 rounded-lg text-sm transition">
        Register
      </button>
    </form>

    <a href="{% url 'login' %}" class="block text-center mt-4 text-sm text-green-700 hover:underline">
      Already have an account? Login
    </a>

  </div>
</div>
{% endblock %}
